; Modern Kinetic Lab quality profile for the Adreno Vulkan path used by the
; Xperia 1 VI (Snapdragon 8 Gen 3). The maze is intentionally rendered at the
; device's native Full HD+ resolution and capped to a thermally sustainable
; 60 fps instead of trading material/shadow quality for a 120 fps target.

[Android_Adreno_Vulkan DeviceProfile]
DeviceType=Android
BaseProfileName=Android_Vulkan
+CVars=r.MobileContentScaleFactor=0.0
+CVars=t.MaxFPS=60
+CVars=r.VSync=1
+CVars=sg.ViewDistanceQuality=3
+CVars=sg.AntiAliasingQuality=2
+CVars=sg.ShadowQuality=3
+CVars=sg.PostProcessQuality=2
+CVars=sg.TextureQuality=3
+CVars=sg.EffectsQuality=2
+CVars=r.BloomQuality=3
+CVars=r.ShadowQuality=3
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.AmbientOcclusionLevels=1
